name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Check frontend
        shell: bash
        run: |
          npm run typecheck
          npm run test:capture
          npm run test:settings
          npm run test:contract
      - name: Build NSIS installer
        run: npm run tauri:build:windows
      - name: Test Rust
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml
      - name: Package and verify portable archive
        shell: pwsh
        run: |
          & scripts\package-portable.ps1
          & scripts\verify-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SnipasteVeya-windows-x64
          path: |
            artifacts/build/v*/*-setup.exe
            artifacts/build/v*/*-portable.zip
            artifacts/build/v*/SHA256SUMS.txt
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            native_arch: x86_64
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
            native_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Check frontend
        run: |
          npm run typecheck
          npm run test:capture
          npm run test:settings
          npm run test:contract
      - name: Build DMG
        run: npm run tauri:build:macos -- --target ${{ matrix.target }}
      - name: Test Rust
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Verify DMG and bundled offline OCR
        run: bash scripts/verify-macos-bundle.sh "${{ matrix.target }}" "${{ matrix.native_arch }}"
      - name: Prepare macOS asset and checksum
        run: |
          version=$(node -p "require('./package.json').version")
          source=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$source"
          mkdir -p artifacts/macos
          asset="SnipasteVeya-${version}-macos-${{ matrix.arch }}.dmg"
          cp "$source" "artifacts/macos/$asset"
          (cd artifacts/macos && shasum -a 256 "$asset" > "SHA256SUMS-${{ matrix.arch }}.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: SnipasteVeya-macos-${{ matrix.arch }}
          path: artifacts/macos/
          if-no-files-found: error

  release:
    name: Publish verified tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify, upload draft, download and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          node scripts/verify-release-assets.mjs release-assets
          assets=(release-assets/SnipasteVeya-* release-assets/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --draft --verify-tag \
              --repo "$GITHUB_REPOSITORY" --title "SnipasteVeya $GITHUB_REF_NAME" \
              --notes-file "docs/release-$GITHUB_REF_NAME.md"
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir downloaded-assets
          cmp release-assets/SHA256SUMS.txt downloaded-assets/SHA256SUMS.txt
          (cd downloaded-assets && sha256sum --check SHA256SUMS.txt)
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --notes-file "docs/release-$GITHUB_REF_NAME.md"
