[package]
name = "snipasteveya"
version = "0.1.0"
description = "Focused screenshot, pin and OCR utility for Windows"
authors = ["turtoncarllyle"]
edition = "2021"
rust-version = "1.78"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[features]
default = ["custom-protocol", "local-ocr"]
custom-protocol = ["tauri/custom-protocol"]
local-ocr = ["dep:oar-ocr"]

[dependencies]
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-dialog = "2.4"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.3"
arboard = "3.6"
base64 = "0.22"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
image25 = { package = "image", version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3.6", features = ["windows-native"] }
oar-ocr = { version = "0.9.2", optional = true, default-features = false, features = ["download-binaries", "simd", "auto-download"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
screenshots = "0.8.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1.18", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
