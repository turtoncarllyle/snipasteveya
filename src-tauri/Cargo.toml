[package]
name = "snipasteveya"
version = "0.1.2"
description = "Focused cross-platform screenshot, pin and OCR utility"
authors = ["turtoncarllyle"]
edition = "2021"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[features]
default = ["custom-protocol", "local-ocr"]
custom-protocol = ["tauri/custom-protocol"]
local-ocr = ["dep:oar-ocr"]

[dependencies]
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-dialog = "2.4"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.3"
arboard = "3.6"
base64 = "0.22"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
image25 = { package = "image", version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
screenshots = "0.8.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1.18", features = ["v4"] }
tokio = { version = "1", features = ["sync", "macros", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2.8", features = [] }
oar-ocr = { version = "0.9.2", optional = true, default-features = false, features = ["simd", "auto-download"] }
# ort's automatic binaries no longer include Intel macOS. Each Mac build loads
# the pinned runtime matching its architecture from Contents/Frameworks.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }

[target.'cfg(windows)'.dependencies]
oar-ocr = { version = "0.9.2", optional = true, default-features = false, features = ["download-binaries", "simd", "auto-download"] }
